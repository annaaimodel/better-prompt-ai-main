name: Site analytics digest

# Pulls GoatCounter visitor stats once a day and commits a digest
# (jobs/analytics.md + jobs/analytics.json) back to the repo, so the numbers
# are readable in-repo without opening the dashboard. Manual runs allowed.
on:
  # SCHEDULE DISABLED 2026-06-26 — site taken offline. To bring it back, uncomment
  # the schedule block below (see docs/REACTIVATE.md).
  # schedule:
  #   - cron: "30 6 * * *"      # daily at 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch analytics
        env:
          # Site code (repo Variable), e.g. "aurum-hts". Token is a repo Secret.
          GOATCOUNTER_SITE: ${{ vars.GOATCOUNTER_SITE }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python jobs/analytics.py

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/analytics.md jobs/analytics.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
          else
            git commit -m "Analytics digest: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected; rebasing and retrying ($i)…"
              git pull --rebase --autostash origin master || true
            done
          fi
