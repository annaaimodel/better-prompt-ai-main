name: High-ticket opportunities

on:
  schedule:
    # Hourly LIGHT refresh (inbox/Quick Add + free APIs). At 06:00 UTC the code
    # runs in HEAVY mode (also Adzuna/JSearch + link validation) — see HEAVY_HOUR
    # in jobs/pipeline.py. 06:00 UTC = 7am UK (BST) / 6am UK (GMT in winter).
    - cron: "0 * * * *"
  workflow_dispatch:           # manual runs are always HEAVY (full pull) for testing

permissions:
  contents: write              # allows the job to commit the daily results back

# Never let two refresh runs overlap (a manual run + the hourly cron, etc.) —
# they'd race on the same push and one would "fail". Queue them instead.
concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # fail fast (and email) instead of hanging if a source stalls
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        env:
          # Optional: point at a published Google-Sheet CSV of inbox jobs.
          # Set this in repo Settings -> Secrets and variables -> Actions -> Variables.
          INBOX_CSV_URL: ${{ vars.INBOX_CSV_URL }}
          # Job-source API keys (Settings -> Secrets and variables -> Actions -> Secrets).
          # Any unset key simply disables that source — nothing breaks.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_API_ID: ${{ secrets.ADZUNA_API_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          # Optional: cap JSearch queries per run to stay under the RapidAPI free
          # quota (~200 req/month). Default 6/run (~180/month). Raise on a paid plan.
          JSEARCH_MAX_QUERIES: ${{ vars.JSEARCH_MAX_QUERIES }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          # Optional: comma-separated Adzuna country codes (default: us,gb,ca,au).
          ADZUNA_COUNTRIES: ${{ vars.ADZUNA_COUNTRIES }}
          # Manual runs do a full HEAVY pull; scheduled runs are light except at HEAVY_HOUR.
          FORCE_HEAVY: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python jobs/pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/daily jobs/store.json jobs/history.csv jobs/latest.html jobs/all.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Opportunities refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Resilient push: if another commit landed first, rebase and retry
            # rather than failing the whole run (avoids false-alarm failures).
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected; rebasing on latest master and retrying ($i)…"
              git pull --rebase --autostash origin master || true
            done
          fi
