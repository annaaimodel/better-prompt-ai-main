name: Daily high-ticket opportunities

on:
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC daily = 7am UK (BST) / 6am UK (GMT in winter).
  workflow_dispatch:           # lets you run it on-demand from the Actions tab

permissions:
  contents: write              # allows the job to commit the daily results back

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # fail fast (and email) instead of hanging if a source stalls
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        env:
          # Optional: point at a published Google-Sheet CSV of inbox jobs.
          # Set this in repo Settings -> Secrets and variables -> Actions -> Variables.
          INBOX_CSV_URL: ${{ vars.INBOX_CSV_URL }}
        run: python jobs/pipeline.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/daily jobs/seen.json jobs/history.csv jobs/latest.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily opportunities: $(date -u +%Y-%m-%d)"
            git push
          fi
