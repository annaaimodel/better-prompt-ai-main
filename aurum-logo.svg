<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="AURUM">
  <defs>
    <!-- Metallic gold: pale champagne highlight down to deep antique gold -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".28" stop-color="#f6e29a"/>
      <stop offset=".52" stop-color="#e7c466"/>
      <stop offset=".74" stop-color="#c99c38"/>
      <stop offset="1" stop-color="#9d6f23"/>
    </linearGradient>
    <!-- Brushed sheen overlay for the wordmark -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".47" stop-color="#fffaf0" stop-opacity=".30"/>
      <stop offset=".52" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- Emblem tile face -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1814"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <!-- Soft background glow -->
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#3a2c0e" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#140f06" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="1200" fill="#0a0a0b"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- Emblem tile -->
  <g transform="translate(600 360)">
    <rect x="-170" y="-170" width="340" height="340" rx="58" fill="url(#tile)"/>
    <rect x="-162" y="-162" width="324" height="324" rx="51" fill="none" stroke="url(#metal)" stroke-width="5"/>
    <!-- inner hairline -->
    <rect x="-146" y="-146" width="292" height="292" rx="42" fill="none" stroke="#c99c38" stroke-opacity=".22" stroke-width="1.5"/>
    <!-- Au -->
    <text x="4" y="74" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="210" fill="url(#metal)">Au</text>
    <!-- element number -->
    <text x="118" y="-92" text-anchor="middle" font-family="Georgia,serif" font-weight="600" font-size="46" fill="#cda23c">79</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(600 700)">
    <text x="0" y="0" text-anchor="middle" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-weight="700" font-size="186" letter-spacing="26" fill="url(#metal)">AURUM</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-weight="700" font-size="186" letter-spacing="26" fill="url(#sheen)">AURUM</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(600 808)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia,serif" font-weight="600" font-size="29" letter-spacing="13" fill="#bfa256">HIGH-TICKET SALES ROLES</text>
    <line x1="-300" y1="34" x2="300" y2="34" stroke="#c99c38" stroke-opacity=".28" stroke-width="1.5"/>
  </g>
</svg>
