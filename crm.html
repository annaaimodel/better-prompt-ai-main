<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agent Call Desk</title>
<style>
:root{
  --bg:#0d0d0f; --panel:#141418; --panel2:#1b1b20; --hov:#1f1f25; --line:#26262d; --line2:#33333c;
  --txt:#f0ede6; --mut:#9b978f; --mut2:#6d6a64;
  --gold:#c99c38; --gold2:#f2dd88;
  --new:#6f7883; --callback:#d99a2b; --confirmed:#3fa66b; --ooo:#8a72c9; --dead:#b8514a; --needswork:#c96b2b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);line-height:1.4;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------------- top bar ---------------- */
header{position:sticky;top:0;z-index:30;background:rgba(13,13,15,.96);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1500px;margin:0 auto;padding:12px 16px 10px}
.title{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:10px}
.title h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em}
.title .own{background:var(--gold);color:#0d0d0f;border-radius:5px;padding:1px 6px;font-size:11px;
  letter-spacing:.09em;vertical-align:2px;margin-left:3px}
.title .sub{color:var(--mut2);font-size:12px}
.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 250px;min-width:180px}
.search input{width:100%;padding:9px 32px;border-radius:9px;border:1px solid var(--line2);
  background:var(--panel);outline:none;font-size:14px}
.search input:focus{border-color:var(--gold)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut2)}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--mut2);cursor:pointer;font-size:17px;padding:2px 7px;border-radius:6px}
.search .clr:hover{color:var(--txt);background:var(--panel2)}
select.sort{padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);
  outline:none;font-size:13px;cursor:pointer}
select.sort:focus{border-color:var(--gold)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--mut);cursor:pointer;
  padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;
  align-items:center;transition:border-color .12s,color .12s,background .12s;white-space:nowrap}
.chip:hover{color:var(--txt);border-color:var(--mut2)}
.chip .n{color:var(--mut2);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{color:#0d0d0f;background:var(--gold);border-color:var(--gold)}
.chip[aria-pressed=true] .n{color:rgba(13,13,15,.62)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--mut2));flex:0 0 auto}
.chip[aria-pressed=true] .dot{background:#0d0d0f}

/* ---------------- list ---------------- */
main{max-width:1500px;margin:0 auto;padding:14px 16px 80px}
.count{color:var(--mut2);font-size:12px;margin:0 0 9px}

.cols{display:grid;gap:0 12px;padding:0 12px 7px;color:var(--mut2);font-size:10.5px;
  font-weight:700;letter-spacing:.11em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{border-bottom:1px solid var(--line)}
.row{display:grid;gap:0 12px;align-items:center;padding:0 12px;min-height:46px;cursor:pointer;
  border-left:3px solid var(--c,var(--new));transition:background .1s}
.row:hover{background:var(--hov)}
.item.open .row{background:var(--panel)}
.cols,.row{grid-template-columns:20px 122px 78px minmax(140px,1.1fr) minmax(150px,1.25fr)
                                 minmax(150px,1.4fr) 132px 30px}
.cols>.h-x{grid-column:1}

.c-exp{color:var(--mut2);font-size:10px;transition:transform .15s;text-align:center}
.item.open .c-exp{transform:rotate(90deg);color:var(--gold)}
.c-april em{display:block;font-style:normal;font-weight:600;font-size:10.5px;color:var(--mut2);
  letter-spacing:.02em;margin-top:-2px}
.c-april{font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-who b{font-weight:650;display:block}
.c-who span{color:var(--mut2);font-size:11.5px;display:block;margin-top:-1px}
.c-who .anon{color:var(--mut2);font-weight:500;font-style:italic}
.c-co{color:var(--gold2);font-weight:600}
.c-addr{color:var(--mut);font-size:13px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-who,.c-co,.c-addr{min-width:0}

.tel{display:inline-block;padding:4px 9px;border-radius:7px;vertical-align:middle;
  border:1px solid var(--line2);background:var(--panel2);text-decoration:none;font-size:12.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.c-tel{min-width:0}
.tel:hover{border-color:var(--gold);background:#26262d}
.tel::before{content:"✆";color:var(--gold);font-size:12px;margin-right:6px}
.tel.off{opacity:.5;cursor:default}.tel.off:hover{border-color:var(--line2);background:var(--panel2)}
.tel.off::before{content:"⚠";color:var(--dead)}
.em{display:inline-flex;align-items:center;justify-content:center;width:28px;height:26px;
  border-radius:7px;border:1px solid var(--line2);background:var(--panel2);text-decoration:none;
  color:var(--mut);font-size:13px}
.em:hover{border-color:var(--gold);color:var(--txt)}
.dash{color:#48454041;color:var(--mut2);opacity:.45}

select.st{width:100%;border-radius:7px;border:1px solid var(--line2);border-left:3px solid var(--c,var(--new));
  background:var(--panel2);padding:5px 6px;font-size:12px;font-weight:650;cursor:pointer;outline:none}
select.st:focus{border-color:var(--gold)}
.flag{color:var(--gold);font-size:11px;margin-left:5px}

/* ---------------- expanded panel ---------------- */
.panel{padding:4px 16px 18px 34px;background:var(--panel);display:grid;gap:18px;
  grid-template-columns:1fr;border-left:3px solid var(--c,var(--new))}
@media(min-width:1000px){.panel{grid-template-columns:minmax(0,1fr) minmax(300px,410px)}}
.detail{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;align-items:baseline}
.detail dt{color:var(--mut2);white-space:nowrap;font-weight:600}
.detail dd{margin:0;word-break:break-word}
.detail .sec{grid-column:1/-1;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;margin-top:11px;padding-top:8px;border-top:1px solid var(--line)}
.detail .sec:first-child{margin-top:2px;padding-top:0;border-top:0}
.hist{grid-column:1/-1;margin:2px 0 0;padding:0}
.hist li{list-style:none;font-size:12.5px;color:var(--mut);padding:6px 0 6px 10px;
  border-left:2px solid var(--line2);white-space:pre-wrap}
.hist li+li{margin-top:4px}
.hist .d{color:var(--gold);font-weight:700;font-size:10px;letter-spacing:.06em;display:block;margin-bottom:2px}
.side{display:flex;flex-direction:column;gap:9px}
.cmt label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--mut2);
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px}
.cmt .saved{color:var(--confirmed);font-weight:600;letter-spacing:.02em;text-transform:none;
  font-size:11px;opacity:0;transition:opacity .2s}
.cmt .saved.on{opacity:1}
.cmt textarea{width:100%;min-height:110px;resize:vertical;padding:9px 10px;border-radius:9px;
  border:1px solid var(--line2);background:var(--panel2);outline:none;font-size:13px;line-height:1.45}
.cmt textarea:focus{border-color:var(--gold);background:#202027}
.cmt textarea::placeholder{color:var(--mut2)}
.stamp{background:none;border:0;color:var(--mut2);cursor:pointer;font-size:11px;padding:0;
  text-transform:none;letter-spacing:0;font-weight:600}
.stamp:hover{color:var(--gold2)}
.edit{border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--panel2)}
.ehead{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ehead .saved{color:var(--confirmed);letter-spacing:.02em;text-transform:none;font-size:11px;
  font-weight:600;opacity:0;transition:opacity .2s}
.ehead .saved.on{opacity:1}
.ef{display:block;margin-bottom:9px}
.ef:last-child{margin-bottom:0}
.el{display:block;color:var(--mut2);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:3px}
.ef input,.ef textarea{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg);color:var(--txt);font-size:13px;outline:none;resize:vertical;font-family:inherit}
.ef input:focus,.ef textarea:focus{border-color:var(--gold)}
.ef.chg input,.ef.chg textarea{border-color:var(--confirmed)}
.orig{display:none;font-size:11px;color:var(--mut2);margin-top:3px}
.ef.chg .orig{display:block}
.revert{background:none;border:0;color:var(--gold2);cursor:pointer;font-size:11px;padding:0;
  text-decoration:underline;text-underline-offset:2px;font-family:inherit}
.revert:hover{color:var(--gold)}
.pencil{color:var(--confirmed);font-size:10px;margin-left:5px}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);
  border-radius:8px;padding:7px 11px;font-size:12.5px;text-decoration:none;cursor:pointer;color:var(--mut)}
.btn:hover{border-color:var(--gold);color:var(--txt)}

/* ---------------- mobile ---------------- */
@media(max-width:860px){
  .cols{display:none}
  .row{grid-template-columns:18px 1fr auto;grid-template-areas:
    "e april st" "e who st" "e co st" "e addr st" "e contact st";
    gap:2px 10px;padding:10px 12px;align-items:start}
  .c-exp{grid-area:e;padding-top:3px}
  .c-april{grid-area:april;font-size:12px;color:var(--mut2);letter-spacing:.06em}
  .c-who{grid-area:who}
  .c-co{grid-area:co}
  .c-addr{grid-area:addr;white-space:normal}
  .c-co{white-space:normal}
  .c-tel,.c-em{grid-area:contact;align-self:center}
  .c-tel{justify-self:start}
  .c-em{justify-self:end}
  .c-tel .tel,.c-em .em{margin-top:7px}
  .c-st{grid-area:st;width:118px}
  .row .dash{display:none}
  .panel{padding:4px 12px 16px 30px}
}
.empty{text-align:center;color:var(--mut2);padding:56px 20px}
footer{border-top:1px solid var(--line);margin-top:26px;padding:16px;text-align:center;
  color:var(--mut2);font-size:11.5px}
footer button{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:8px;
  padding:6px 12px;cursor:pointer;font-size:11.5px;margin:0 4px}
footer button:hover{border-color:var(--gold);color:var(--txt)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--gold);
  color:#0d0d0f;font-weight:700;font-size:13px;padding:9px 17px;border-radius:9px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
mark{background:rgba(201,156,56,.32);color:inherit;border-radius:2px}
</style></head>

   sheet value everywhere — list row, search, call links and export. */

function persist() {
  for (const [k, v] of Object.entries(saved))          // keep only cases actually touched
    if (!v.comment && v.status === "new" && !Object.keys(v.edits || {}).length) delete saved[k];

  catch (e) { toast("Couldn't save — browser storage is blocked"); }

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const teams = t => "msteams:/l/call/0/0?users=4:" + encodeURIComponent(t);
/* Turn a typed UK number into something Teams can dial, or null if it can't be. */
function dialable(v) {
  v = String(v || "").trim();
  if (!v || /^\d(\.\d+)?[eE]\+?\d+$/.test(v)) return null;       // Excel-mangled
  let first = v.split(/\s*\/\s*(?=[\d+])/)[0];                    // "0121 … / 0770…" -> first
  first = first.replace(/\((?:0\)|Direct\)?)/gi, "").replace(/\([^)]*\)/g, "");
  let d = first.replace(/[^\d+]/g, "").replace(/^\.+/, "");
  if (d.startsWith("+")) { const c = "+" + d.slice(1).replace(/\D/g, ""); return c.length >= 11 ? c : null; }
  d = d.replace(/\D/g, "");
  if (d.startsWith("44") && d.length >= 12) return "+" + d;
  if (d.startsWith("0")  && d.length >= 10) return "+44" + d.slice(1);
  if (d.length >= 9) return "+44" + d;
  return null;
}
const telOf = r => { const e = rec(r.april).edits || {};
                     return "phone" in e ? dialable(e.phone) : r.tel; };
const addrOf = r => val(r, "addrPurchase") || val(r, "addrSale");
const byId = id => DATA.find(r => r.april === id);
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1900);
}
function copy(text, btn) {
  const label = btn.dataset.label || "Copy";
  const done = ok => { btn.textContent = ok ? "✓ Copied" : "Copy failed";
                       setTimeout(() => btn.textContent = label, 1200); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
  else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); done(ok);
  }
}

/* ---------- one list row ---------- */
function rowCells(r) {
  const st = rec(r.april).status;
  const opts = STATUSES.map(([v, l]) =>
    `<option value="${v}"${v === st ? " selected" : ""}>${l}</option>`).join("");
  const name = val(r, "name"), role = val(r, "role");
  const phone = val(r, "phone"), email = val(r, "email"), addr = addrOf(r), t = telOf(r);

  const tel = phone
    ? (t ? `<a class="tel" href="${esc(teams(t))}" title="Call ${esc(phone)} in Teams">${esc(phone)}</a>`
         : `<span class="tel off" title="Not a dialable number — you can correct it in the row">${esc(phone)}</span>`)
    : `<span class="dash">—</span>`;
  const em = email
    ? `<a class="em" href="mailto:${esc(email)}" title="${esc(email)}">✉</a>`
    : `<span class="dash">—</span>`;
  const mark = rec(r.april).comment
    ? `<span class="flag" title="You have notes on this one">●</span>`
    : (edited(r) ? `<span class="pencil" title="You have edited this one">✎</span>` : "");

  return `<span class="c-exp">▸</span>
    <span class="c-st"><select class="st" style="--c:${SVAR[st]}" aria-label="Status">${opts}</select></span>
    <span class="c-april" title="${esc(r.april)}">${esc(r.april)}
      <em>${r.dateOfData ? esc(r.dateOfData) : "no date"}</em></span>
    <span class="c-who trunc">${name
        ? `<b class="trunc">${esc(name)}</b>${role ? `<span class="trunc">${esc(role)}</span>` : ""}`
        : `<b class="anon">No named contact</b>`}${mark}</span>
    <span class="c-co trunc" title="${esc(r.company)}">${esc(r.company) || `<span class="dash">—</span>`}</span>
    <span class="c-addr trunc" title="${esc(addr)}">${esc(addr) || `<span class="dash">—</span>`}</span>
    <span class="c-tel">${tel}</span>
    <span class="c-em">${em}</span>`;
}
const rowHTML = r =>
  `<article class="item" data-id="${esc(r.april)}" style="--c:${SVAR[rec(r.april).status]}">
     <div class="row">${rowCells(r)}</div>
   </article>`;

/* ---------- expanded panel, built on demand ---------- */
function panelHTML(r) {
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const sec = t => `<div class="sec">${t}</div>`;
  let d = sec("Case") +
    row("April no.", r.april) + row("Quote case ref", r.quoteRef) + row("Case start", r.caseStart) +
    row("Case status", r.status) + row("Fee earner", r.feeEarner) + row("Data as at", r.dateOfData) +
    row("Owner", r.owner) + row("Booked for", r.bookedFor) +
    (r.versions > 1 ? row("Sheet rows merged", r.versions) : "");
  if (r.referral || r.agentSale || r.agentPurchase)
    d += sec("Agents") + row("Referral", r.referral) + row("Sale", r.agentSale) + row("Purchase", r.agentPurchase);
  if (r.stock || r.lh || r.fh || r.sstc || r.sstcWeeks || r.fallThrough)
    d += sec("Stock") + row("Stock", r.stock) + row("Leasehold", r.lh) + row("Freehold", r.fh) +
         row("SSTC", r.sstc) + row("SSTC in weeks", r.sstcWeeks) + row("Fall-through (last 3 mo)", r.fallThrough);
  if (r.aeOutstanding || r.potentialSignOff || r.aeMissing || r.aeDefect || r.aeNotDone)
    d += sec("AE") + row("AE outstanding", r.aeOutstanding) + row("Potential sign-off", r.potentialSignOff) +
         row("CL s.2 non-PSO missing", r.aeMissing) + row("CL s.2 non-PSO defect", r.aeDefect) +
         row("Sign-off not done", r.aeNotDone);
  if (r.history.length)
    d += sec(r.history.length > 1 ? "Note history" : "Sheet note") +
         `<ul class="hist">` + r.history.map(n =>
           `<li>${n.date ? `<span class="d">${esc(n.date)}</span>` : ""}${esc(n.text)}</li>`).join("") + `</ul>`;

  const t = telOf(r), email = val(r, "email"), addr = addrOf(r);
  const acts = [];
  if (t)     acts.push(`<a class="btn" href="${esc(teams(t))}">✆ Call in Teams</a>`,
                       `<button class="btn cp" data-copy="${esc(t)}" data-label="Copy number">Copy number</button>`);
  if (email) acts.push(`<a class="btn" href="mailto:${esc(email)}">✉ ${esc(email)}</a>`,
                       `<button class="btn cp" data-copy="${esc(email)}" data-label="Copy email">Copy email</button>`);
  if (addr)  acts.push(`<button class="btn cp" data-copy="${esc(addr)}" data-label="Copy address">Copy address</button>`);

  return `<div class="panel" style="--c:${SVAR[rec(r.april).status]}">
    <dl class="detail">${d}</dl>
    <div class="side">
      ${editHTML(r)}
      ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}
      <div class="cmt">
        <label for="c-${esc(r.april)}"><span>My comments</span>
          <span><button class="stamp" type="button">+ date stamp</button>
                <span class="saved">saved</span></span></label>
        <textarea id="c-${esc(r.april)}"
          placeholder="Call notes, who you spoke to, what to do next…">${esc(rec(r.april).comment)}</textarea>
      </div>
    </div>
  </div>`;
}

/* ---------- editable contact & property fields ---------- */
function editHTML(r) {
  const e = rec(r.april).edits || {};
  const fields = EDITABLE.map(([f, label]) => {
    const cur = val(r, f) || "";
    const changed = (f in e) && (e[f] || "") !== (r[f] || "");
    const box = f.startsWith("addr")
      ? `<textarea data-f="${f}" rows="2" placeholder="—">${esc(cur)}</textarea>`
      : `<input data-f="${f}" value="${esc(cur)}" placeholder="—" autocomplete="off">`;
    return `<label class="ef${changed ? " chg" : ""}" data-for="${f}">
       <span class="el">${label}</span>${box}
       <span class="orig">Sheet had:
         <button type="button" class="revert" data-rf="${f}">${esc(r[f] || "(blank)")}</button></span>
     </label>`;
  }).join("");
  return `<div class="edit">
    <div class="ehead"><span>Contact &amp; property</span><span class="saved esaved">saved</span></div>
    ${fields}
  </div>`;
}

let filter = "all", query = "", sortBy = "newest", open = new Set();

function sorted(list) {
  const order = Object.fromEntries(STATUSES.map((x, i) => [x[0], i]));
  // newest "Data as at" at the top; undated cases sink to the bottom either way,
  // with case start then April number breaking ties
  const age = (a, b) => (b.dataTs || 0) - (a.dataTs || 0) ||
                        (b.startTs || 0) - (a.startTs || 0) ||
                        b.april.localeCompare(a.april, undefined, { numeric: true });
  const by = {
    newest:  age,
    oldest:  (a, b) => (a.dataTs ? 0 : 1) - (b.dataTs ? 0 : 1) || -age(a, b),
    company: (a, b) => (a.company || "~").localeCompare(b.company || "~") || a.april.localeCompare(b.april),
    name:    (a, b) => (a.name || "~").localeCompare(b.name || "~"),
    april:   (a, b) => a.april.localeCompare(b.april, undefined, { numeric: true }),
    status:  (a, b) => order[rec(a.april).status] - order[rec(b.april).status] || age(a, b),
    touched: (a, b) => (rec(b.april).updated || 0) - (rec(a.april).updated || 0)
  }[sortBy];
  return [...list].sort(by);
}
const matches = r =>
  (filter === "all" || rec(r.april).status === filter) &&
  (!query || (() => { const s = blob(r); return query.split(/\s+/).every(t => s.includes(t)); })());

function render() {
  const list = sorted(DATA).filter(matches);
  document.getElementById("list").innerHTML = list.map(rowHTML).join("");
  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("count").textContent =
    `${list.length} of ${DATA.length} cases` +
    (filter !== "all" ? ` · ${SLABEL[filter]}` : "") + (query ? ` · matching “${query}”` : "");
  open.forEach(id => {
    const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
    if (el) expand(el, true);
  });
  if (query) highlight();
  counts();
}

function expand(item, on) {
  const id = item.dataset.id;
  if (on) {
    if (!item.querySelector(".panel")) item.insertAdjacentHTML("beforeend", panelHTML(byId(id)));
    item.classList.add("open"); open.add(id);
  } else {
    item.querySelector(".panel")?.remove();
    item.classList.remove("open"); open.delete(id);
  }
}

function highlight() {
  const terms = query.split(/\s+/).filter(t => t.length > 1)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!terms.length) return;
  const re = new RegExp("(" + terms.join("|") + ")", "gi");
  const walk = document.createTreeWalker(document.getElementById("list"), NodeFilter.SHOW_TEXT);
  const hits = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    const p = n.parentNode.nodeName;
    if (p !== "TEXTAREA" && p !== "OPTION" && p !== "SELECT" && re.test(n.nodeValue)) hits.push(n);
  }
  hits.forEach(n => {
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
    n.parentNode.replaceChild(span, n);
  });
}

function counts() {
  const c = { all: DATA.length };
  STATUSES.forEach(([v]) => c[v] = 0);
  DATA.forEach(r => c[rec(r.april).status]++);
  document.querySelectorAll("#filters .chip").forEach(ch => {
    ch.querySelector(".n").textContent = c[ch.dataset.v] ?? 0;
    ch.setAttribute("aria-pressed", String(ch.dataset.v === filter));
  });
  document.getElementById("sub").textContent =
    `${DATA.length} cases · ${DATA.length - c.new} worked · ${c.callback} to call back`;
}

/* ---------- filters ---------- */
document.getElementById("filters").innerHTML =
  [["all", "All", null], ...STATUSES].map(([v, l, cv]) =>
    `<button class="chip" data-v="${v}" aria-pressed="${v === "all"}" ${cv ? `style="--c:var(${cv})"` : ""}>
       ${cv ? '<span class="dot"></span>' : ""}${l} <span class="n"></span></button>`).join("");
document.getElementById("filters").addEventListener("click", e => {
  const ch = e.target.closest(".chip"); if (!ch) return;
  filter = ch.dataset.v; render();
});

/* ---------- search / sort ---------- */
const q = document.getElementById("q"), clr = document.getElementById("clr");
let t0;
q.addEventListener("input", () => {
  clr.hidden = !q.value;
  clearTimeout(t0);
  t0 = setTimeout(() => { query = q.value.trim().toLowerCase(); render(); }, 130);
});
clr.addEventListener("click", () => { q.value = ""; query = ""; clr.hidden = true; render(); q.focus(); });
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); q.focus(); q.select();
  }
  if (e.key === "Escape" && document.activeElement.tagName !== "TEXTAREA") {
    document.querySelectorAll(".item.open").forEach(i => expand(i, false));
  }
});

/* ---------- row interactions ---------- */
const listEl = document.getElementById("list");

function flash(el) {
  if (!el) return;
  el.classList.add("on"); clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 1200);
}
/* rebuild the call/copy buttons so they use the edited number, email and address */
function refreshActions(item, r) {
  const box = item.querySelector(".acts"); if (!box) return;
  const t = telOf(r), email = val(r, "email"), addr = addrOf(r), acts = [];
  if (t)     acts.push(`<a class="btn" href="${esc(teams(t))}">✆ Call in Teams</a>`,
                       `<button class="btn cp" data-copy="${esc(t)}" data-label="Copy number">Copy number</button>`);
  if (email) acts.push(`<a class="btn" href="mailto:${esc(email)}">✉ ${esc(email)}</a>`,
                       `<button class="btn cp" data-copy="${esc(email)}" data-label="Copy email">Copy email</button>`);
  if (addr)  acts.push(`<button class="btn cp" data-copy="${esc(addr)}" data-label="Copy address">Copy address</button>`);
  box.innerHTML = acts.join("");
}

listEl.addEventListener("click", e => {
  const cp = e.target.closest(".cp");
  if (cp) { copy(cp.dataset.copy, cp); return; }
  const rv = e.target.closest(".revert");
  if (rv) {
    const item = rv.closest(".item"), id = item.dataset.id, f = rv.dataset.rf, r = byId(id);
    delete mut(id).edits[f]; mut(id).updated = Date.now(); persist();
    const lab = item.querySelector(`.ef[data-for="${f}"]`);
    lab.classList.remove("chg");
    lab.querySelector("input,textarea").value = r[f] || "";
    item.querySelector(".row").innerHTML = rowCells(r);
    refreshActions(item, r);
    return;
  }
  const st = e.target.closest(".stamp");
  if (st) {
    const ta = st.closest(".panel").querySelector(".cmt textarea");   // never an address field
    const d = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
    ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n" : "") + d + " — ";
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  if (e.target.closest("a, select, textarea, input, button")) return;  // let links & controls do their thing
  const row = e.target.closest(".row"); if (!row) return;
  const item = row.closest(".item");
  expand(item, !item.classList.contains("open"));
});

listEl.addEventListener("change", e => {
  const sel = e.target.closest("select.st"); if (!sel) return;
  const item = sel.closest(".item"), id = item.dataset.id;
  const r = mut(id); r.status = sel.value; r.updated = Date.now(); persist();
  item.style.setProperty("--c", SVAR[sel.value]);
  sel.style.setProperty("--c", SVAR[sel.value]);
  item.querySelector(".panel")?.style.setProperty("--c", SVAR[sel.value]);
  counts();
  if (filter !== "all" && filter !== sel.value) render();
});

listEl.addEventListener("input", e => {
  const fld = e.target.closest("[data-f]");
  if (fld) {                                            // editing a sheet field
    const item = fld.closest(".item"), id = item.dataset.id, f = fld.dataset.f;
    const r = byId(id);
    clearTimeout(fld._t);
    fld._t = setTimeout(() => {
      const s = mut(id);
      s.edits[f] = fld.value.trim();
      if (s.edits[f] === (r[f] || "")) delete s.edits[f];   // typed back to the sheet value
      s.updated = Date.now();
      persist();
      fld.closest(".ef").classList.toggle("chg", f in s.edits);
      item.querySelector(".row").innerHTML = rowCells(r);   // keep the list in step
      refreshActions(item, r);
      flash(item.querySelector(".esaved"));
    }, 400);
    return;
  }
  const ta = e.target.closest("textarea"); if (!ta) return;
  const item = ta.closest(".item"), id = item.dataset.id;
  clearTimeout(ta._t);
  ta._t = setTimeout(() => {
    const r = mut(id); r.comment = ta.value; r.updated = Date.now(); persist();
    flash(item.querySelector(".cmt .saved"));
    item.querySelector(".row").innerHTML = rowCells(byId(id));   // refresh the ● / ✎ marker
  }, 400);
});

/* ---------- export / import ---------- */
/* Hosted, the page can't start a download itself — the host saves for us.
   Opened as a local file there's no host, so the ordinary anchor works. */
async function saveFile(filename, data) {
  let downloads = null;
  try { if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); }
  catch (e) { /* not hosted */ }
  if (downloads) {
    try { await downloads.save({ filename, data }); return "saved"; }
    catch (e) { return e && e.code === "declined" ? "declined" : "failed"; }
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return "saved";
  } catch (e) { return "failed"; }
}

document.getElementById("export").addEventListener("click", async () => {
  const rows = DATA.filter(r => saved[r.april]).map(r => ({
    april: r.april, name: val(r, "name"), company: r.company,
    status: SLABEL[saved[r.april].status], comment: saved[r.april].comment,
    edits: saved[r.april].edits || {},
    updated: saved[r.april].updated ? new Date(saved[r.april].updated).toISOString() : "" }));
  if (!rows.length) { toast("Nothing saved yet"); return; }
  const name = "call-desk-notes-" + new Date().toISOString().slice(0, 10) + ".json";
  const r = await saveFile(name, JSON.stringify(rows, null, 2));
  toast(r === "saved"    ? rows.length + " saved cases exported"
      : r === "declined" ? "Export cancelled"
                         : "Couldn't save the file");
});

const file = document.getElementById("file");
document.getElementById("import").addEventListener("click", () => file.click());
file.addEventListener("change", () => {
  const f = file.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const rows = JSON.parse(fr.result);
      if (!Array.isArray(rows)) throw 0;
      const back = Object.fromEntries(STATUSES.map(([v, l]) => [l, v]));
      let n = 0;
      rows.forEach(x => {
        if (!x || !x.april) return;
        const r = mut(String(x.april));
        if (x.comment) r.comment = x.comment;
        if (x.status && back[x.status]) r.status = back[x.status];
        if (x.edits && typeof x.edits === "object") Object.assign(r.edits, x.edits);
        r.updated = Date.parse(x.updated) || Date.now();
        n++;
      });
      persist(); render(); toast(n + " cases restored");
    } catch (e) { toast("That file wasn't a notes export"); }
    file.value = "";
  };
  fr.readAsText(f);
});

render();
</script>
</body></html>
