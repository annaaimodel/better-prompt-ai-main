<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agent Call Desk</title>
<style>
:root{
  --bg:#0d0d0f; --panel:#16161a; --panel2:#1c1c21; --line:#2a2a31; --line2:#35353e;
  --txt:#f0ede6; --mut:#9b978f; --mut2:#6f6c66;
  --gold:#c99c38; --gold2:#f2dd88;
  --new:#7d8794; --callback:#d99a2b; --confirmed:#3fa66b; --ooo:#8a72c9; --dead:#b8514a; --needswork:#c96b2b;
  --focus:#c99c38;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(13,13,15,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 18px 12px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.title h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.title .sub{color:var(--mut2);font-size:12.5px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 260px;min-width:200px}
.search input{width:100%;padding:10px 34px 10px 34px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel);outline:none;font-size:14.5px}
.search input:focus{border-color:var(--focus)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut2);font-size:14px}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--mut2);cursor:pointer;font-size:17px;padding:2px 7px;border-radius:6px}
.search .clr:hover{color:var(--txt);background:var(--panel2)}
select.sort{padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);
  outline:none;font-size:14px;cursor:pointer}
select.sort:focus{border-color:var(--focus)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--mut);cursor:pointer;
  padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center;
  transition:border-color .12s,color .12s,background .12s}
.chip:hover{color:var(--txt);border-color:var(--mut2)}
.chip .n{color:var(--mut2);font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{color:#0d0d0f;background:var(--gold);border-color:var(--gold)}
.chip[aria-pressed=true] .n{color:rgba(13,13,15,.65)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--mut2))}
.chip[aria-pressed=true] .dot{background:#0d0d0f}

/* ---------- list ---------- */
main{max-width:1180px;margin:0 auto;padding:20px 18px 90px}
.count{color:var(--mut2);font-size:12.5px;margin:0 0 14px}
.cards{display:grid;gap:14px}
@media(min-width:900px){.cards{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
  border-left:3px solid var(--c,var(--new));display:flex;flex-direction:column;gap:11px}
.card.hidden{display:none}

.chead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.april{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--gold2);text-transform:uppercase}
.april b{display:block;font-size:21px;letter-spacing:0;color:var(--txt);font-variant-numeric:tabular-nums;
  font-weight:700;margin-top:1px}
.who{font-size:16px;font-weight:650;margin:6px 0 1px}
.who.none{color:var(--mut2);font-weight:500;font-style:italic}
.role{color:var(--mut);font-size:13px}
.co{color:var(--gold2);font-size:13.5px;font-weight:600;margin-top:7px}

select.st{border-radius:9px;border:1px solid var(--line2);background:var(--panel2);padding:7px 9px;
  font-size:12.5px;font-weight:650;cursor:pointer;outline:none;flex:0 0 auto;
  border-left:3px solid var(--c,var(--new))}
select.st:focus{border-color:var(--focus)}

.contact{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);
  border-radius:10px;padding:8px 12px;font-size:13.5px;text-decoration:none;cursor:pointer;
  transition:border-color .12s,background .12s;max-width:100%}
.act:hover{border-color:var(--gold);background:#232329}
.act .lb{color:var(--mut2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.act .vl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.dead{cursor:default;opacity:.6}.act.dead:hover{border-color:var(--line2);background:var(--panel2)}
.copy{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:8px 10px;
  cursor:pointer;color:var(--mut);font-size:12.5px}
.copy:hover{border-color:var(--gold);color:var(--txt)}
.none-i{color:var(--mut2);font-size:13px;font-style:italic;padding:8px 0}

.addr{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.addr .lb{color:var(--mut2);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:3px}
.addr .row+.row{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

.lastnote{font-size:13.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);
  border-left:2px solid var(--line2);border-radius:8px;padding:9px 11px;white-space:pre-wrap;
  max-height:78px;overflow:auto}

details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;color:var(--mut);font-size:12.5px;font-weight:650;list-style:none;
  display:flex;align-items:center;gap:6px;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";color:var(--gold);font-size:11px;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary:hover{color:var(--txt)}
.detail{margin-top:11px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;
  align-items:baseline}
.detail dt{color:var(--mut2);white-space:nowrap;font-weight:600}
.detail dd{margin:0;color:var(--txt);word-break:break-word}
.detail .sec{grid-column:1/-1;color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.detail .sec:first-child{margin-top:0;padding-top:0;border-top:0}
.hist{grid-column:1/-1;margin:0}
.hist li{list-style:none;font-size:12.5px;color:var(--mut);padding:7px 0 7px 11px;
  border-left:2px solid var(--line2);white-space:pre-wrap}
.hist li+li{margin-top:5px}
.hist .d{color:var(--gold);font-weight:700;font-size:10.5px;letter-spacing:.06em;display:block;margin-bottom:2px}

.cmt{margin-top:2px}
.cmt label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  color:var(--mut2);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:5px}
.cmt .saved{color:var(--confirmed);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:11.5px;
  opacity:0;transition:opacity .2s}
.cmt .saved.on{opacity:1}
.cmt textarea{width:100%;min-height:66px;resize:vertical;padding:10px 11px;border-radius:10px;
  border:1px solid var(--line2);background:var(--panel2);outline:none;font-size:13.5px;line-height:1.45}
.cmt textarea:focus{border-color:var(--focus);background:#202026}
.cmt textarea::placeholder{color:var(--mut2)}
.stamp{background:none;border:0;color:var(--mut2);cursor:pointer;font-size:11.5px;padding:0;
  text-transform:none;letter-spacing:0;font-weight:600}
.stamp:hover{color:var(--gold2)}

.empty{text-align:center;color:var(--mut2);padding:60px 20px;font-size:14.5px}

footer{border-top:1px solid var(--line);margin-top:30px;padding:18px;text-align:center;
  color:var(--mut2);font-size:12px}
footer button{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:8px;
  padding:6px 12px;cursor:pointer;font-size:12px;margin:0 4px}
footer button:hover{border-color:var(--gold);color:var(--txt)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--gold);
  color:#0d0d0f;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:10px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
mark{background:rgba(201,156,56,.3);color:inherit;border-radius:2px}
</style></head>

<header>
 <div class="bar">

</header>

eEarner":"Jessica Trim","aeOutstanding":"21","potentialSignOff":"5","aeMissing":"15","aeDefect":"0","aeNotDone":"0","addrSale":"","addrPurchase":"52 Southmead Close Mayfield","company":"Wood And Pilcher - Heathfield","notes":"Appt booked with HG 21.04 The branch is Crowborough 01892665666 Dan -","history":[{"date":"14/04/2026","text":"Appt booked with HG 21.04 The branch is Crowborough 01892665666 Dan -"}]},{"april":"307594","versions":1,"quoteRef":"307586","referral":"3-Family and Friends - Global","agentSale":"","agentPurchase":"Woodlands Estate Agents - Horsham","caseStart":"27/05/2026","name":"","role":"","email":"","phone":"","tel":"","dateOfData":"8/6/2026","stock":"24","lh":"15","fh":"9","sstc":"113","sstcWeeks":"16.14286","fallThrough":"16.67%","status":"Live","feeEarner":"Neuza Silva","aeOutstanding":"6","potentialSignOff":"5","aeMissing":"1","aeDefect":"0","aeNotDone":"4","addrSale":"","addrPurchase":"99a Swindon Road Horsham","company":"Woodlands Estate Agents - Horsham","notes":"Calling Simon Ley Monday.","history":[{"date":"8/6/2026","text":"Calling Simon Ley Monday."}]}];
const STATUSES = [
  ["new","New","--new"], ["callback","Call back","--callback"], ["confirmed","Confirmed","--confirmed"],
  ["ooo","OOO","--ooo"], ["dead","Dead","--dead"], ["needswork","Needs work","--needswork"]
];
const SLABEL = Object.fromEntries(STATUSES.map(s => [s[0], s[1]]));
const SVAR   = Object.fromEntries(STATUSES.map(s => [s[0], `var(${s[2]})`]));
const KEY = "callDesk.v1";

/* ---------- saved state ---------- */
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
const BLANK = Object.freeze({ status: "new", comment: "", updated: 0 });
const rec = id => saved[id] || BLANK;                                  // read-only
const mut = id => (saved[id] ||= { status: "new", comment: "", updated: 0 });
function persist() {
  // keep only cases actually touched, so the store stays small
  for (const [k, v] of Object.entries(saved))
    if (!v.comment && v.status === "new") delete saved[k];
  try { localStorage.setItem(KEY, JSON.stringify(saved)); }
  catch (e) { toast("Couldn't save — browser storage is blocked"); }
}

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const teams = t => "msteams:/l/call/0/0?users=4:" + encodeURIComponent(t);
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1900);
}
function copy(text, btn) {
  const done = ok => { btn.textContent = ok ? "✓" : "×"; setTimeout(() => btn.textContent = "⧉", 1100); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
  else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); done(ok);
  }
}

/* ---------- searchable blob ---------- */
DATA.forEach(r => {
  r._s = [r.april, r.quoteRef, r.name, r.role, r.company, r.agentSale, r.agentPurchase,
          r.referral, r.email, r.phone, r.addrSale, r.addrPurchase, r.feeEarner,
          ...r.history.map(h => h.text)].join(" ").toLowerCase();
});

/* ---------- rendering ---------- */
function detailRows(r) {
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const sec = t => `<div class="sec">${t}</div>`;
  let h = "";
  h += sec("Case");
  h += row("April no.", r.april) + row("Quote case ref", r.quoteRef) +
       row("Case start", r.caseStart) + row("Case status", r.status) +
       row("Fee earner", r.feeEarner) + row("Data as at", r.dateOfData) +
       row("Owner", r.owner) + row("Booked for", r.bookedFor) +
       (r.versions > 1 ? row("Sheet rows merged", r.versions) : "");

  if (r.referral || r.agentSale || r.agentPurchase) {
    h += sec("Agents");
    h += row("Referral", r.referral) + row("Sale", r.agentSale) + row("Purchase", r.agentPurchase);
  }
  if (r.stock || r.lh || r.fh || r.sstc || r.sstcWeeks || r.fallThrough) {
    h += sec("Stock");
    h += row("Stock", r.stock) + row("Leasehold", r.lh) + row("Freehold", r.fh) +
         row("SSTC", r.sstc) + row("SSTC in weeks", r.sstcWeeks) +
         row("Fall-through (last 3 mo)", r.fallThrough);
  }
  if (r.aeOutstanding || r.potentialSignOff || r.aeMissing || r.aeDefect || r.aeNotDone) {
    h += sec("AE");
    h += row("AE outstanding", r.aeOutstanding) + row("Potential sign-off", r.potentialSignOff) +
         row("CL s.2 non-PSO missing", r.aeMissing) + row("CL s.2 non-PSO defect", r.aeDefect) +
         row("Sign-off not done", r.aeNotDone);
  }
  if (r.history.length) {
    h += sec(r.history.length > 1 ? "Note history" : "Sheet note");
    h += `<ul class="hist">` + r.history.map(n =>
      `<li>${n.date ? `<span class="d">${esc(n.date)}</span>` : ""}${esc(n.text)}</li>`).join("") + `</ul>`;
  }
  return h;
}

function cardHTML(r) {
  const st = rec(r.april).status;
  const opts = STATUSES.map(([v, l]) =>
    `<option value="${v}"${v === st ? " selected" : ""}>${l}</option>`).join("");

  const phone = r.phone
    ? (r.tel
        ? `<a class="act" href="${esc(teams(r.tel))}" title="Call ${esc(r.tel)} in Teams">
             <span class="lb">Teams</span><span class="vl">${esc(r.phone)}</span></a>
           <button class="copy" data-copy="${esc(r.tel)}" title="Copy number">⧉</button>`
        : `<span class="act dead" title="Number was corrupted by Excel — not dialable">
             <span class="lb">No.</span><span class="vl">${esc(r.phone)} ⚠</span></span>`)
    : "";
  const email = r.email
    ? `<a class="act" href="mailto:${esc(r.email)}"><span class="lb">Email</span>
         <span class="vl">${esc(r.email)}</span></a>
       <button class="copy" data-copy="${esc(r.email)}" title="Copy email">⧉</button>`
    : "";
  const contact = (phone || email)
    ? `<div class="contact">${phone}${email}</div>`
    : `<div class="none-i">No direct number or email on the sheet</div>`;

  let addr = "";
  if (r.addrPurchase || r.addrSale) {
    const one = (l, v) => v ? `<div class="row"><span class="lb">${l}</span>${esc(v)}</div>` : "";
    addr = `<div class="addr">${one("Purchase", r.addrPurchase)}${one("Sale", r.addrSale)}</div>`;
  }
  const last = r.notes ? `<div class="lastnote">${esc(r.notes)}</div>` : "";

  return `<article class="card" data-id="${esc(r.april)}" style="--c:${SVAR[st]}">
    <div class="chead">
      <div>
        <div class="april">April<b>${esc(r.april)}</b></div>
        <div class="who${r.name ? "" : " none"}">${esc(r.name || "No named contact")}</div>
        ${r.role ? `<div class="role">${esc(r.role)}</div>` : ""}
        ${r.company ? `<div class="co">${esc(r.company)}</div>` : ""}
      </div>
      <select class="st" style="--c:${SVAR[st]}" aria-label="Status">${opts}</select>
    </div>
    ${contact}
    ${addr}
    ${last}
    <details class="more"><summary>Full case detail</summary><dl class="detail">${detailRows(r)}</dl></details>
    <div class="cmt">
      <label for="c-${esc(r.april)}">
        <span>My comments</span>
        <span><button class="stamp" type="button">+ date stamp</button>
              <span class="saved">saved</span></span>
      </label>
      <textarea id="c-${esc(r.april)}" placeholder="Call notes, who you spoke to, what to do next…">${esc(rec(r.april).comment)}</textarea>
    </div>
  </article>`;
}

/* ---------- state ---------- */
let filter = "all", query = "", sortBy = "company";

function sorted(list) {
  const s = [...list];
  const order = Object.fromEntries(STATUSES.map((x, i) => [x[0], i]));
  const by = {
    company:  (a, b) => (a.company || "~").localeCompare(b.company || "~") || a.april.localeCompare(b.april),
    name:     (a, b) => (a.name || "~").localeCompare(b.name || "~"),
    april:    (a, b) => a.april.localeCompare(b.april, undefined, { numeric: true }),
    status:   (a, b) => order[rec(a.april).status] - order[rec(b.april).status] ||
                        (a.company || "~").localeCompare(b.company || "~"),
    touched:  (a, b) => (rec(b.april).updated || 0) - (rec(a.april).updated || 0)
  }[sortBy];
  return s.sort(by);
}

function matches(r) {
  if (filter !== "all" && rec(r.april).status !== filter) return false;
  if (!query) return true;
  return query.split(/\s+/).every(t => r._s.includes(t));
}

function render() {
  const list = sorted(DATA).filter(matches);
  document.getElementById("cards").innerHTML = list.map(cardHTML).join("");
  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("count").textContent =
    `${list.length} of ${DATA.length} cases` +
    (filter !== "all" ? ` · ${SLABEL[filter]}` : "") + (query ? ` · matching “${query}”` : "");
  if (query) highlight();
  counts();
}

function highlight() {
  const terms = query.split(/\s+/).filter(t => t.length > 1)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!terms.length) return;
  const re = new RegExp("(" + terms.join("|") + ")", "gi");
  const walk = document.createTreeWalker(document.getElementById("cards"), NodeFilter.SHOW_TEXT);
  const hits = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    const p = n.parentNode.nodeName;
    if (p !== "TEXTAREA" && p !== "OPTION" && p !== "SELECT" && re.test(n.nodeValue)) hits.push(n);
  }
  hits.forEach(n => {
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
    n.parentNode.replaceChild(span, n);
  });
}

function counts() {
  const c = { all: DATA.length };
  STATUSES.forEach(([v]) => c[v] = 0);
  DATA.forEach(r => c[rec(r.april).status]++);
  document.querySelectorAll("#filters .chip").forEach(ch => {
    ch.querySelector(".n").textContent = c[ch.dataset.v] ?? 0;
    ch.setAttribute("aria-pressed", String(ch.dataset.v === filter));
  });
  const done = DATA.length - c.new;
  document.getElementById("sub").textContent =
    `${DATA.length} cases · ${done} worked · ${c.callback} to call back`;
}

/* ---------- filters ---------- */
document.getElementById("filters").innerHTML =
  [["all", "All", null], ...STATUSES].map(([v, l, cv]) =>
    `<button class="chip" data-v="${v}" aria-pressed="${v === "all"}"
       ${cv ? `style="--c:var(${cv})"` : ""}>
       ${cv ? '<span class="dot"></span>' : ""}${l} <span class="n"></span></button>`).join("");

document.getElementById("filters").addEventListener("click", e => {
  const ch = e.target.closest(".chip"); if (!ch) return;
  filter = ch.dataset.v; render();
});

/* ---------- search / sort ---------- */
const q = document.getElementById("q"), clr = document.getElementById("clr");
let t0;
q.addEventListener("input", () => {
  clr.hidden = !q.value;
  clearTimeout(t0);
  t0 = setTimeout(() => { query = q.value.trim().toLowerCase(); render(); }, 130);
});
clr.addEventListener("click", () => { q.value = ""; query = ""; clr.hidden = true; render(); q.focus(); });
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); q.focus(); q.select();
  }
});

/* ---------- card interactions ---------- */
const cards = document.getElementById("cards");

cards.addEventListener("change", e => {
  const sel = e.target.closest("select.st"); if (!sel) return;
  const card = sel.closest(".card"), id = card.dataset.id;
  const r = mut(id); r.status = sel.value; r.updated = Date.now(); persist();
  card.style.setProperty("--c", SVAR[sel.value]);
  sel.style.setProperty("--c", SVAR[sel.value]);
  counts();
  if (filter !== "all" && filter !== sel.value) { card.classList.add("hidden"); render(); }
});

cards.addEventListener("input", e => {
  const ta = e.target.closest("textarea"); if (!ta) return;
  const card = ta.closest(".card"), id = card.dataset.id;
  clearTimeout(ta._t);
  ta._t = setTimeout(() => {
    const r = mut(id); r.comment = ta.value; r.updated = Date.now(); persist();
    const f = card.querySelector(".saved");
    f.classList.add("on"); clearTimeout(f._t);
    f._t = setTimeout(() => f.classList.remove("on"), 1200);
  }, 400);
});

cards.addEventListener("click", e => {
  const cp = e.target.closest(".copy");
  if (cp) { copy(cp.dataset.copy, cp); return; }
  const st = e.target.closest(".stamp");
  if (st) {
    const ta = st.closest(".card").querySelector("textarea");
    const d = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
    ta.value = (ta.value ? ta.value.replace(/\s*$/, "") + "\n" : "") + d + " — ";
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  }
});

/* ---------- export / import ---------- */
document.getElementById("export").addEventListener("click", () => {
  const rows = DATA.filter(r => saved[r.april] &&
      (saved[r.april].comment || saved[r.april].status !== "new"))
    .map(r => ({ april: r.april, name: r.name, company: r.company,
                 status: SLABEL[saved[r.april].status], comment: saved[r.april].comment,
                 updated: saved[r.april].updated
                   ? new Date(saved[r.april].updated).toISOString() : "" }));
  if (!rows.length) { toast("Nothing saved yet"); return; }
  const blob = new Blob([JSON.stringify(rows, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "call-desk-notes-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(rows.length + " saved cases exported");
});

const file = document.getElementById("file");
document.getElementById("import").addEventListener("click", () => file.click());
file.addEventListener("change", () => {
  const f = file.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const rows = JSON.parse(fr.result);
      if (!Array.isArray(rows)) throw 0;
      const back = Object.fromEntries(STATUSES.map(([v, l]) => [l, v]));
      let n = 0;
      rows.forEach(x => {
        if (!x || !x.april) return;
        const r = mut(String(x.april));
        if (x.comment) r.comment = x.comment;
        if (x.status && back[x.status]) r.status = back[x.status];
        r.updated = Date.parse(x.updated) || Date.now();
        n++;
      });
      persist(); render(); toast(n + " cases restored");
    } catch (e) { toast("That file wasn't a notes export"); }
    file.value = "";
  };
  fr.readAsText(f);
});

render();
</script>
