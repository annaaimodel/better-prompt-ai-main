<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<style>
:root{--bg:#0f1420;--card:#171e2e;--line:#2a3348;--txt:#e8edf6;--mut:#9aa7bd;--accent:#5b8cff;--new:#2ecc71}
*{box-sizing:border-box}
body{width:340px;margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px}
header{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0}
.gear{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px}
.wrap{padding:0 14px 14px}
label{display:block;color:var(--mut);font-size:11px;margin:8px 0 3px}
input,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1626;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:42px;resize:vertical}
.two{display:flex;gap:8px}.two>div{flex:1}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;font-size:13px;font-weight:700;color:#fff;background:var(--accent);border:none;padding:10px;border-radius:8px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);flex:none;padding:10px 12px}
.status{color:var(--new);font-size:12px;min-height:16px;margin-top:8px}
.saved{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.saved h2{font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1c2334}
.row small{color:var(--mut)}
.del{background:none;border:none;color:var(--mut);cursor:pointer;font-size:13px}
.muted{color:var(--mut)}
.export{margin-top:8px;background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0}
</style></head>
<body>
<header><h1>Save this job</h1><button class="gear" id="opts" title="Options">⚙</button></header>
<div class="wrap">
  <label>Title</label><input id="title" placeholder="Job title">
  <div class="two">
    <div><label>Company</label><input id="company" placeholder="Company"></div>
    <div><label>Comp</label><input id="comp" placeholder="e.g. $5k/mo"></div>
  </div>
  <div class="two">
    <div><label>Location</label><input id="location" placeholder="Remote"></div>
    <div><label>Source</label><input id="source" placeholder="where from"></div>
  </div>
  <label>Link</label><input id="link" placeholder="https://…">
  <label>Notes (optional)</label><textarea id="notes" placeholder="anything worth remembering"></textarea>
  <div class="btns">
    <button class="btn" id="save">Save to board</button>
  </div>
  <div class="status" id="status"></div>
  <div class="saved">
    <h2>Saved jobs (<span id="count">0</span>) <button class="export" id="export">Export CSV</button></h2>
    <div id="list"></div>
  </div>
</div>
<script src="popup.js"></script>
</body></html>
