<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AURUM">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".3" stop-color="#f6e29a"/>
      <stop offset=".55" stop-color="#e7c466"/>
      <stop offset="1" stop-color="#a87d28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#3a2c0e" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#140f06" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0b"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- emblem tile -->
  <g transform="translate(600 188)">
    <rect x="-66" y="-66" width="132" height="132" rx="26" fill="#0c0b0a"/>
    <rect x="-62" y="-62" width="124" height="124" rx="22" fill="none" stroke="url(#metal)" stroke-width="3.4"/>
    <text x="2" y="30" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="84" fill="url(#metal)">Au</text>
    <text x="44" y="-34" text-anchor="middle" font-family="Georgia,serif" font-weight="600" font-size="18" fill="#cda23c">79</text>
  </g>

  <!-- wordmark -->
  <text x="600" y="368" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-weight="700" font-size="118" letter-spacing="20" fill="url(#metal)">AURUM</text>

  <!-- tagline -->
  <text x="600" y="438" text-anchor="middle" font-family="Georgia,serif" font-weight="600" font-size="27" letter-spacing="6" fill="#bfa256">HIGH-TICKET SALES</text>

  <!-- strap -->
  <line x1="360" y1="486" x2="840" y2="486" stroke="#c99c38" stroke-opacity=".3" stroke-width="1.4"/>
  <text x="600" y="528" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-style="italic" font-weight="500" font-size="30" fill="#e9e0cc">The Gold Standard for Your High-Ticket Job Search</text>
</svg>
